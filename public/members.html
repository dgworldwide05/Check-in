<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Members</title>
  <meta name="theme-color" content="#4B1530"/>
  <link rel="stylesheet" href="theme.css"/>
  <div id="pin-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f2f5;display:flex;justify-content:center;align-items:center;z-index:9999">
    <div style="background:white;padding:2rem;border-radius:16px;width:100%;max-width:340px;box-shadow:0 2px 12px rgba(0,0,0,0.1);text-align:center">
      <img src="logo.png" style="width:180px;margin-bottom:1rem" alt="logo"/>
      <h2 style="font-size:18px;color:#111;margin-bottom:0.3rem">Admin Access</h2>
      <p style="font-size:13px;color:#666;margin-bottom:1.5rem">Enter your PIN to continue</p>
      <input type="password" id="pin-input" maxlength="6" placeholder="Enter PIN" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:18px;text-align:center;letter-spacing:8px;outline:none;margin-bottom:1rem"/>
      <button onclick="checkPin()" style="width:100%;padding:11px;background:#111;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer">Enter</button>
      <div id="pin-error" style="color:#e74c3c;font-size:13px;margin-top:0.8rem;display:none">Wrong PIN! Try again.</div>
    </div>
  </div>
</head>
<body class="page-admin">

<div class="top">
  <div class="top-left">
    <img src="logo.png" style="height:60px; margin-bottom:4px;" alt="Dwellers Gold Worldwide" />
    <p class="title">All Members</p>
    <p class="sub" id="member-count-sub"></p>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <a href="attendance.html" class="btn">Attendance Dashboard</a>
    <button class="btn" onclick="exportCSV()">Export CSV</button>
    <button class="btn primary" onclick="loadMembers()">Refresh</button>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="lbl">Total members</div>
    <div class="val" id="s-total">0</div>
  </div>
  <div class="stat green">
    <div class="lbl">Members</div>
    <div class="val" id="s-members">0</div>
  </div>
  <div class="stat blue">
    <div class="lbl">Visitors on file</div>
    <div class="val" id="s-visitors">0</div>
  </div>
</div>

<div class="card" style="margin-bottom:1.5rem">
  <div class="card-top"><h2>Leaders</h2></div>
  <div class="bar">
    <input type="text" id="new-leader-name" placeholder="Leader name" />
    <input type="text" id="new-leader-phone" placeholder="Phone (optional)" />
    <button class="btn primary" onclick="addLeader()">Add leader</button>
  </div>
  <div id="leader-list"></div>
</div>

<div class="card">
  <div class="card-top">
    <h2>Registered members &amp; visitors</h2>
  </div>
  <input class="search" type="text" id="search" placeholder="Search by name, phone, department or leader..." oninput="filterTable()" />
  <div class="bar">
    <select id="filter-leader" onchange="filterTable()"></select>
    <span style="color:#999;font-size:12px">Tick members, then:</span>
    <select id="assign-leader"></select>
    <button class="btn primary" onclick="assignSelected()">Assign to leader</button>
  </div>
  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="check-all" onchange="toggleAll(this)" /></th>
        <th>Name</th>
        <th>Phone</th>
        <th>Department</th>
        <th>Birthday</th>
        <th>Location</th>
        <th>Leader</th>
        <th>Type</th>
        <th>Registered</th>
      </tr>
    </thead>
    <tbody id="mem-body">
      <tr><td colspan="9" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // PIN is checked on the server now; the browser never sees it.
  async function checkPin() {
    const entered = document.getElementById('pin-input').value;
    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: entered })
      });
      if (res.ok) { location.reload(); return; }
    } catch (e) {}
    document.getElementById('pin-error').style.display = 'block';
    document.getElementById('pin-input').value = '';
  }
  fetch('/admin/me').then(r => r.json()).then(d => {
    if (d.authed) document.getElementById('pin-screen').style.display = 'none';
  }).catch(() => {});
  document.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPin(); });

  let allMembers = [];
  const MONTH_NAMES = ['','January','February','March','April','May','June','July','August','September','October','November','December'];

  function formatBirthday(r) {
    if (!r.birthday_day || !r.birthday_month) return '—';
    return `${r.birthday_day} ${MONTH_NAMES[r.birthday_month] || ''}`.trim();
  }

  function updateStats(records) {
    const members = records.filter(r => r.type === 'member').length;
    const visitors = records.filter(r => r.type === 'visitor').length;
    document.getElementById('s-total').textContent = records.length;
    document.getElementById('s-members').textContent = members;
    document.getElementById('s-visitors').textContent = visitors;
    document.getElementById('member-count-sub').textContent = records.length + ' people on file';
  }

  function renderTable(records) {
    const tbody = document.getElementById('mem-body');
    if (records.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty">No members found</td></tr>`;
      return;
    }
    tbody.innerHTML = records.map((r, i) => `
      <tr>
        <td><input type="checkbox" class="row-check" value="${r.id}" /></td>
        <td><strong>${esc(r.name)}</strong></td>
        <td>${esc(r.phone) || '—'}</td>
        <td>${esc(r.department) || '—'}</td>
        <td>${formatBirthday(r)}</td>
        <td>${esc(r.location) || '—'}</td>
        <td>${esc(r.leader_name) || '<span style="color:#bbb">Unassigned</span>'}</td>
        <td><span class="badge ${esc(r.type)}">${esc(r.type)}</span></td>
        <td class="time">${r.created_at ? new Date(r.created_at).toLocaleDateString('en-GB') : '—'}</td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase();
    const lf = document.getElementById('filter-leader').value;
    const filtered = allMembers.filter(r =>
      (lf === '' || (lf === 'none' ? !r.leader_id : String(r.leader_id) === lf)) &&
      (r.name.toLowerCase().includes(q) ||
      (r.leader_name || '').toLowerCase().includes(q) ||
      (r.phone || '').includes(q) ||
      (r.department || '').toLowerCase().includes(q) ||
      (r.location || '').toLowerCase().includes(q))
    );
    renderTable(filtered);
  }

  let leaders = [];

  async function loadLeaders() {
    const res = await fetch('/leaders');
    leaders = await res.json();
    if (!Array.isArray(leaders)) leaders = [];
    const opts = leaders.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');
    document.getElementById('filter-leader').innerHTML =
      '<option value="">All leaders</option><option value="none">Unassigned only</option>' + opts;
    document.getElementById('assign-leader').innerHTML =
      '<option value="">Choose leader…</option><option value="clear">— Remove leader —</option>' + opts;
    document.getElementById('leader-list').innerHTML = leaders.length
      ? leaders.map(l => `<div class="lead"><span><strong>${esc(l.name)}</strong> ${l.phone ? '· ' + esc(l.phone) : ''} · ${l.member_count} member(s)</span><button onclick="removeLeader(${l.id})">Remove</button></div>`).join('')
      : '<div class="empty">No leaders yet — add one above</div>';
  }

  async function addLeader() {
    const name = document.getElementById('new-leader-name').value.trim();
    const phone = document.getElementById('new-leader-phone').value.trim();
    if (!name) return alert('Enter the leader\'s name');
    const res = await fetch('/leaders', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name, phone }) });
    const d = await res.json();
    if (!d.success) return alert(d.message || 'Failed');
    document.getElementById('new-leader-name').value = '';
    document.getElementById('new-leader-phone').value = '';
    await loadLeaders();
  }

  async function removeLeader(id) {
    if (!confirm('Remove this leader? Their members become unassigned.')) return;
    await fetch('/leaders/' + id, { method: 'DELETE' });
    await loadLeaders();
    await loadMembers();
  }

  function toggleAll(box) {
    document.querySelectorAll('.row-check').forEach(c => c.checked = box.checked);
  }

  async function assignSelected() {
    const ids = [...document.querySelectorAll('.row-check:checked')].map(c => Number(c.value));
    const choice = document.getElementById('assign-leader').value;
    if (ids.length === 0) return alert('Tick at least one member first');
    if (choice === '') return alert('Choose a leader (or "Remove leader")');
    const res = await fetch('/members/assign-leader', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ memberIds: ids, leaderId: choice === 'clear' ? null : Number(choice) })
    });
    const d = await res.json();
    if (!d.success) return alert(d.message || 'Failed');
    document.getElementById('check-all').checked = false;
    await loadLeaders();
    await loadMembers();
  }

  async function loadMembers() {
    const res = await fetch('/members');
    allMembers = await res.json();
    updateStats(allMembers);
    filterTable();
  }

  function exportCSV() {
    const rows = [['Name','Phone','Department','Birthday','Location','Leader','Type','Registered']];
    allMembers.forEach(r => rows.push([r.name, r.phone, r.department, formatBirthday(r), r.location || '', r.leader_name || '', r.type,
      r.created_at ? new Date(r.created_at).toLocaleDateString() : '']));
    const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv,' + encodeURIComponent(csv);
    a.download = 'all_members.csv';
    a.click();
  }

  loadLeaders().then(loadMembers);
</script>
</body>
</html>
